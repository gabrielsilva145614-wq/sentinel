<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Entrar | Sentinel 2.1</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <main class="auth-container">
    <section class="auth-card" aria-labelledby="loginTitle">
      <a class="brand" href="login.html" aria-label="Sentinel 2.1">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3 5 6v5c0 4.7 2.7 8.2 7 10 4.3-1.8 7-5.3 7-10V6l-7-3Z"/>
            <path d="m9.5 12 1.7 1.7 3.6-3.9"/>
          </svg>
        </span>
        <span><strong>SENTINEL</strong><small>2.1</small></span>
      </a>

      <header class="auth-header">
        <h1 id="loginTitle">Bem-vindo de volta</h1>
        <p>Entre para acessar o painel de segurança.</p>
      </header>

      <div id="loginFeedback" class="form-feedback error" hidden></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
            <button class="password-toggle" type="button" onclick="togglePassword('password', this)" aria-pressed="false">Mostrar</button>
          </div>
        </div>

        <div class="form-row">
          <label class="check-line"><input type="checkbox" id="remember"><span>Lembrar de mim</span></label>
          <a class="text-link" href="#" onclick="alert('Recuperação de senha é uma demonstração de interface.'); return false;">Esqueci a senha</a>
        </div>

        <button class="primary-button" type="submit">Entrar</button>
      </form>

      <div class="demo-box">
        <div>
          <strong>Conta de teste</strong>
          <span>operador@sentinel.com</span>
        </div>
        <button id="fillDemo" class="small-button" type="button">Preencher</button>
      </div>

      <p class="auth-switch">Ainda não tem conta? <a class="text-link" href="cadastro.html">Cadastre-se</a></p>
    </section>

    <p class="page-note">Sentinel Security • Ambiente acadêmico</p>
  </main>

  <script src="auth.js"></script>
</body>
</html>
