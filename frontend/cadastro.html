<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Criar conta | Sentinel 2.1</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <main class="auth-container">
    <section class="auth-card auth-card-wide" aria-labelledby="registerTitle">
      <a class="brand" href="login.html?force=1" aria-label="Sentinel 2.1">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3 5 6v5c0 4.7 2.7 8.2 7 10 4.3-1.8 7-5.3 7-10V6l-7-3Z"/>
            <path d="M9 12h6M12 9v6"/>
          </svg>
        </span>
        <span><strong>SENTINEL</strong><small>2.1</small></span>
      </a>

      <header class="auth-header">
        <h1 id="registerTitle">Criar sua conta</h1>
        <p>Preencha os dados para acessar o painel.</p>
      </header>

      <div id="registerFeedback" class="form-feedback error" hidden></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name">Nome completo</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Seu nome" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" required>
            <button class="password-toggle" type="button" onclick="togglePassword('password', this)" aria-pressed="false">Mostrar</button>
          </div>
          <div class="password-meter"><span id="passwordStrength" data-level="0"></span></div>
          <div class="password-help"><span>Use maiúscula e número</span><span id="passwordStrengthLabel">Muito fraca</span></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar senha</label>
          <div class="input-wrap">
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Digite novamente" required>
            <button class="password-toggle" type="button" onclick="togglePassword('confirmPassword', this)" aria-pressed="false">Mostrar</button>
          </div>
        </div>

        <label class="check-line terms-line"><input type="checkbox" id="terms"><span>Li e aceito os termos de uso.</span></label>

        <button class="primary-button" type="submit">Criar conta</button>
      </form>

      <p class="auth-switch">Já possui uma conta? <a class="text-link" href="login.html?force=1">Entrar</a></p>
    </section>

    <p class="page-note">Sentinel Security • Ambiente acadêmico</p>
  </main>

  <script src="auth.js"></script>
</body>
</html>
